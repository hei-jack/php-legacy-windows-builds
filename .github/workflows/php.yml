name: Build PHP 7.3.33 with CVE Patches

on:
  workflow_dispatch:
  push:
    tags:
      - 'build-7.3.33-*'

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Visual Studio 2022 installation
        id: vs-locate
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            Write-Error "vswhere.exe not found."
            exit 1
          }

          # 动态获取 VS 2022 实际安装路径，不再硬编码 Enterprise
          $installPath = & $vswhere -latest -products * -version "[17.0,18.0)" -property installationPath
          if (-not $installPath) {
            Write-Error "Visual Studio 2022 installation not found."
            exit 1
          }
          Write-Host "Found VS 2022 at: $installPath"
          echo "VS_INSTALL_PATH=$installPath" >> $env:GITHUB_OUTPUT

      - name: Install VC15 (v141) toolset
        shell: pwsh
        run: |
          $installPath = "${{ steps.vs-locate.outputs.VS_INSTALL_PATH }}"
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $component = "Microsoft.VisualStudio.Component.VC.v141.x86.x64"

          $args = @(
            "modify",
            "--installPath", "`"$installPath`"",
            "--add", $component,
            "--quiet", "--norestart", "--nocache"
          )
          Start-Process -FilePath $installer -ArgumentList $args -Wait -NoNewWindow

      - name: Verify VC15 toolset is installed
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vc15Path = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.v141.x86.x64 -property installationPath
          if (-not $vc15Path) {
            Write-Error "VC15 (v141) toolset was NOT installed successfully. Aborting early."
            exit 1
          }
          Write-Host "VC15 toolset confirmed at: $vc15Path"
          # 将 VC15 路径输出供后续步骤使用
          echo "VC15_PATH=$vc15Path" >> $env:GITHUB_OUTPUT
        id: verify-vc15

      - name: Set VC15_DIR environment variable
        shell: pwsh
        run: |
          # 用环境变量引导 SDK，替代修改 phpsdk_setshell.bat（该文件可能被 build.ps1 覆盖）
          $vc15Dir = "${{ steps.verify-vc15.outputs.VC15_PATH }}\VC"
          echo "VC15_DIR=$vc15Dir" >> $env:GITHUB_ENV
          Write-Host "VC15_DIR set to: $vc15Dir"

      - name: Build PHP 7.3.33 with patches
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\build.ps1 -Version 7.3

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: php-7.3.33-cve2026-windows
          path: C:\php-sdk\dist\*.zip
          retention-days: 7
          if-no-files-found: error
