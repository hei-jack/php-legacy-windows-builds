name: Build PHP 7.3.33 with CVE Patches

on:
  workflow_dispatch: # 允许在 Actions 页面手动触发
  push:
    tags:
      - 'build-7.3.33-*' # 可选：推送特定 tag 时自动触发

jobs:
  build:
    # 使用 windows-2022 运行器。它虽然预装 VS2019，但通常也包含 VS2017 的生成工具。
    # 如果遇到编译器问题，可尝试降级为 `windows-2017`（如果平台仍支持）。
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install VC15 (VS2017) toolset
        shell: pwsh
        run: |
          # 使用 VS Installer 命令行安装 VC15 (v141) 组件，以便在 windows-2022 上构建 PHP 7.3
          Set-Location "C:\Program Files (x86)\Microsoft Visual Studio\Installer\"
          $installPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          $component = "Microsoft.VisualStudio.Component.VC.v141.x86.x64"
          $args = "/c", "vs_installer.exe", "modify", "--installPath", "`"$installPath`"", `
                  "--add", $component, "--quiet", "--norestart", "--nocache"
          Start-Process -FilePath "cmd.exe" -ArgumentList $args -Wait -NoNewWindow

      - name: Point PHP SDK to installed VC15
        shell: pwsh
        run: |
          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.v141.x86.x64 -property installationPath
          Write-Host "Found VC15 at: $vsPath"

          # 关键：修改 SDK 的设置脚本，告诉它去哪里找 VC15
          $sdkShellScript = ".\php-sdk-binary-tools\bin\phpsdk_setshell.bat" # 根据仓库实际路径调整
          if (Test-Path $sdkShellScript) {
            (Get-Content $sdkShellScript) -replace 'set VC15_DIR=.*', "set VC15_DIR=$vsPath\VC" | Set-Content $sdkShellScript
            Write-Host "Patched $sdkShellScript to use VC15_DIR=$vsPath\VC"
          } else {
            Write-Error "phpsdk_setshell.bat not found at $sdkShellScript"
          }
  
      - name: Build PHP 7.3.33 with patches
        shell: powershell
        # 直接调用仓库的 build.ps1，指定版本为 7.3。
        # 脚本会自动完成源码克隆、补丁应用、依赖获取和编译全过程。
        run: .\build.ps1 -Version 7.3
        # 根据 README，产物位于 C:\php-sdk\dist
        # 整个编译过程可能需要较长时间（20-40 分钟），请耐心等待。

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: php-7.3.33-cve2026-windows
          path: C:\php-sdk\dist\*.zip
          # 保留 7 天，可按需调整
          retention-days: 7
          # 如果目录为空，任务会失败，便于及时发现问题
          if-no-files-found: error
