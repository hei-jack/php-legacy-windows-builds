name: Build PHP 7.3.33 with CVE Patches (Chocolatey VC15)

on:
  workflow_dispatch:
  push:
    tags:
      - 'build-7.3.33-*'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        variant: [TS, NTS]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Chocolatey
        shell: pwsh
        run: |
          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
            Set-ExecutionPolicy Bypass -Scope Process -Force
            [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
            Invoke-Expression ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
          }

      - name: Install VS2017 Community + Native Desktop workload via Chocolatey
        shell: pwsh
        run: |
          # 按 php-legacy-windows-builds 项目要求，安装带 "Desktop development with C++" 的 VS2017
          choco install -y visualstudio2017community --version=15.9.7.0 --no-progress
          choco install -y visualstudio2017-workload-nativedesktop --no-progress
          # 部分场景需要显式补装 VC++ 构建工具包
          choco install -y visualcpp-build-tools --no-progress

      - name: Verify VC15 is detectable
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vc15 = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.v141.x86.x64 -property installationPath
          if (-not $vc15) {
            Write-Error "VC15 (v141) still not detectable after Chocolatey install. Aborting."
            exit 1
          }
          Write-Host "VC15 confirmed at: $vc15"

      - name: Build PHP 7.3.33 (${{ matrix.variant }})
        shell: pwsh
        run: |
          # 使用 -Flavors 参数分别构建 TS 和 NTS（见项目 README）
          powershell -ExecutionPolicy Bypass -File .\build.ps1 -Version 7.3 -Flavors ${{ matrix.variant }}

      - name: Upload build artifacts (${{ matrix.variant }})
        uses: actions/upload-artifact@v4
        with:
          name: php-7.3.33-${{ matrix.variant }}-win64
          path: C:\php-sdk\dist\*.zip
          retention-days: 7
          if-no-files-found: error
