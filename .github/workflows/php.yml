name: Build PHP 7.3.33 with CVE Patches

on:
  workflow_dispatch:
  push:
    tags:
      - 'build-7.3.33-*'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        variant: [nts, ts]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install VS2017 Build Tools (VC15) for PHP 7.3
        shell: pwsh
        run: |
          Write-Host "Installing VS2017 Build Tools (VC15) on windows-2022..."
          
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          if (-not (Test-Path $installer)) {
            throw "vs_installer.exe not found. Cannot install VC15."
          }

          # 使用 vs_installer 安装 VC15 核心组件和工作负载
          $vsArgs = @(
            "modify",
            "--installPath", "`"${env:ProgramFiles(x86)}\Microsoft Visual Studio\2017\BuildTools`"",
            "--add", "Microsoft.VisualStudio.Workload.VCTools",
            "--add", "Microsoft.VisualStudio.Component.VC.v141.x86.x64",
            "--quiet", "--norestart", "--nocache"
          )
          
          $process = Start-Process -FilePath $installer -ArgumentList $vsArgs -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0 -and $process.ExitCode -ne 3010) {
            throw "VC15 installation failed with exit code $($process.ExitCode)."
          }
          Write-Host "VC15 toolset installation completed."

      - name: Build PHP 7.3.33 (${{ matrix.variant }})
        shell: pwsh
        run: |
          # 根据矩阵变量构建 NTS 或 TS 版本
          # 参考 PHP74 项目：-Nts 用于 NTS，省略则默认为 TS
          if ('${{ matrix.variant }}' -eq 'nts') {
            powershell -ExecutionPolicy Bypass -File .\build.ps1 -Version 7.3 -Nts
          } else {
            powershell -ExecutionPolicy Bypass -File .\build.ps1 -Version 7.3
          }

      - name: Upload build artifacts (${{ matrix.variant }})
        uses: actions/upload-artifact@v4
        with:
          name: php-7.3.33-${{ matrix.variant }}-win64
          path: C:\php-sdk\dist\*.zip
          retention-days: 7
          if-no-files-found: error
